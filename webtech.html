
<!DOCTYPE html>
<html>
<head>
    <title>Student Table</title>

    <style>
        table {
            width: 70%;
            margin: 30px auto;
            text-align: center;
            font-family: Arial, sans-serif;
        }

        th, td {
            border: 1px solid black;
            padding: 12px;
        }

        th {
            background-color: navy;
            color: white;
        }

        tr:hover {
            background-color: lightblue;
        }

        tr:nth-child(even) {
            background-color: lightgray;
        }

        h2::before {
            color: orange;
        }

        h2::after {
            color: orange;
        }
    </style>
</head>

<body>

    <h2 >Student Details</h2>

    <table>
        <tr>
            <th>Student Name</th>
            <th>Roll Number</th>
            <th>Subject</th>
        </tr>

        </tr>

        </tr>

        <tr>

        </tr>

        <tr>

    </table>

</body>
</html>
